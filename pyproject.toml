[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runhand"
version = "0.1.0"
description = "Deterministic filesystem worker for agent-driven computational research workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jin Nakazono" },
]
dependencies = []

[project.scripts]
runhand = "runhand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runhand = ["py.typed"]
